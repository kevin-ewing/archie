<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Archie</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14130f; }
      /* No text selection, long-press callouts or tap highlights while flying (iOS / Android). */
      body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; touch-action: none; opacity: 0; transition: opacity 0.8s; }
      canvas.ready { opacity: 1; }
      #debug { position: fixed; right: 8px; top: 8px; margin: 0; padding: 6px 8px; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #e8e2cf; background: rgb(20 19 15 / 0.75); pointer-events: none; white-space: pre; }
      /* Cockpit-placard style toggle, bottom-right (clear of the gauges, in thumb reach). */
      #hands-off {
        position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
        min-width: 44px; min-height: 44px; padding: 8px 12px; border-radius: 3px; cursor: pointer;
        font: 600 12px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-transform: uppercase;
        color: #e8e2cf; background: rgb(20 19 15 / 0.7); border: 1px solid rgb(232 226 207 / 0.5);
        touch-action: manipulation;
      }
      #hands-off[aria-pressed="true"] { color: #14130f; background: #d9c58f; border-color: #d9c58f; }
      #hands-off kbd { font: inherit; opacity: 0.6; margin-left: 6px; }
      @media (pointer: coarse) { #hands-off kbd { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Archie game view"></canvas>
    <button id="hands-off" type="button" aria-pressed="false" title="Let go of the stick: the plane flies straight and level">Hands off<kbd>T</kbd></button>
    <pre id="debug" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
