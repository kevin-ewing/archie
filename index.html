<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Archie - Play</title>
    <meta name="description" content="Fly a fragile biplane across a living 1915 landscape in this atmospheric browser game." />
    <meta name="theme-color" content="#14130f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Archie — A First World War Flying Game" />
    <meta property="og:description" content="Fly a fragile biplane across a living 1915 landscape." />
    <meta property="og:url" content="https://kevin-ewing.github.io/archie/" />
    <meta property="og:image" content="https://kevin-ewing.github.io/archie/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art First World War biplane flying over forest and clouds" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Archie — A First World War Flying Game" />
    <meta name="twitter:description" content="Fly a fragile biplane across a living 1915 landscape." />
    <meta name="twitter:image" content="https://kevin-ewing.github.io/archie/social-card.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #14130f; }
      /* No text selection, long-press callouts or tap highlights while flying (iOS / Android). */
      body, button, input, canvas, svg { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: absolute; left: 0; top: 0; image-rendering: pixelated; touch-action: none; cursor: default; }
      #loading { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: white; opacity: 1; transition: opacity 0.8s; pointer-events: none; }
      #loading.done { opacity: 0; }
      #loading-flight { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: top 0.9s ease-in-out; }
      #loading.settling #loading-flight { top: 72%; }
      #loading-plane, #loading-text { display: block; image-rendering: pixelated; }
      #loading-text { position: absolute; left: 50%; bottom: calc(100% + 18px); transform: translateX(-50%); opacity: 1; transition: opacity 0.9s ease-in-out; }
      #loading.settling #loading-text { opacity: 0; }
      #launch { position: absolute; left: 50%; bottom: calc(100% + 30px); width: 48px; height: 52px; padding: 0; border: 0; color: #14130f; background: transparent; opacity: 0; pointer-events: none; transform: translateX(-50%); transition: opacity 0.5s, color 0.12s; cursor: pointer; }
      #launch svg { width: 33px; height: 45px; fill: currentColor; filter: drop-shadow(-1.5px -1.5px 0 #b8b7b1) drop-shadow(1.5px 1.5px 0 #fff); }
      #launch:hover, #launch:focus-visible { color: #66645d; outline: none; }
      #loading.ready-to-launch { pointer-events: auto; }
      #loading.awaiting-launch #launch { opacity: 1; pointer-events: auto; }
      #loading.awaiting-launch #launch svg { animation: launch-pulse 1.15s ease-in-out infinite; }
      @keyframes launch-pulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { #launch svg { animation: none !important; } }
      #debug { position: fixed; right: 8px; top: 8px; margin: 0; padding: 6px 8px; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #e8e2cf; background: rgb(20 19 15 / 0.75); pointer-events: none; white-space: pre; }
      .volume-control {
        position: fixed; z-index: 20; visibility: hidden; cursor: pointer;
      }
      .volume-control canvas, #hands-off canvas { display: block; image-rendering: pixelated; }
      .volume-control input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
      #hands-off, #map-bearing {
        position: fixed; z-index: 20; visibility: hidden; padding: 0; border: 0; background: transparent; cursor: pointer; touch-action: manipulation;
      }
      #hands-off:disabled, #map-bearing:disabled { cursor: default; opacity: 0.55; }
      .volume-control input:focus-visible, #hands-off:focus-visible, #map-bearing:focus-visible { outline: 2px solid #ead695; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Archie game view"></canvas>
    <div id="loading" role="status" aria-label="Preparing flight">
      <div id="loading-flight">
        <canvas id="loading-text" aria-hidden="true"></canvas>
        <canvas id="loading-plane" aria-hidden="true"></canvas>
        <button id="launch" type="button" aria-label="Begin flight"><svg viewBox="0 0 11 15" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 1h1v1H4zM6 1h1v1H6zM3 2h1v1H3zM7 2h1v1H7zM2 3h1v1H2zM8 3h1v1H8zM1 4h1v1H1zM9 4h1v1H9z" /><rect x="5" y="0" width="1" height="15" /></svg></button>
      </div>
    </div>
    <label id="music-control" class="volume-control"><canvas id="music-volume-label" aria-hidden="true"></canvas><input id="music-volume" type="range" min="0" max="100" value="40" aria-label="Music volume" /></label>
    <label id="audio-control" class="volume-control"><canvas id="engine-volume-label" aria-hidden="true"></canvas><input id="engine-volume" type="range" min="0" max="100" value="40" aria-label="Engine volume" /></label>
    <button id="hands-off" type="button" aria-label="Hold steady (T)" aria-pressed="false" title="Let go of the stick: the plane flies straight and level"><canvas id="hold-steady-label" aria-hidden="true"></canvas></button>
    <button id="map-bearing" type="button" aria-label="Consult map: set bearing to nearest trench" title="Consult map: pin a trench bearing. Tap again to take a fresh bearing."></button>
    <pre id="debug" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
